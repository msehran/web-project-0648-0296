<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop All Products | VÉLORA</title>
    <link rel="stylesheet" href="./css/globals.css">
    <link rel="stylesheet" href="./css/layout/header.css">
    <link rel="stylesheet" href="./css/layout/hero-section.css">
    <link rel="stylesheet" href="./css/shop.css">
    <link rel="stylesheet" href="./css/layout/footer.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>

<body>
    <header id="header"></header>

    <main class="main">
        <section class="hero"></section>
        <section class="products">
            <aside class="products-filter">
                <div class="filter-heading">
                    <h4 class="filter-heading-h4">Categories</h4>
                    <i class="bi bi-chevron-down"></i>
                </div>
                <div class="filter-options"></div>
                <div class="filter-group">
                    <h4 class="filter-heading-h4">Product Type</h4>
                    <div class="type-options"></div>
                </div>
                <div class="filter-group">
                    <h4 class="filter-heading-h4">Size</h4>
                    <div class="size-options">
                    </div>
                </div>
                <div class="filter-group">
                    <h4 class="filter-heading-h4">Color</h4>
                    <div class="color-options">
                    </div>
                </div>
                <div class="filter-group price-filter">
                    <h4 class="filter-heading-h4">Price Range</h4>
                    <div class="price-slider">
                        <input type="range" min="0" max="200" value="200">
                    </div>
                    <div class="price-labels">
                        <span>$0</span>
                        <span>$200</span>
                    </div>
                </div>
                <button class="clear-filters" type="reset"
                    onclick="document.querySelector('.products-filter').querySelectorAll('input').forEach(input => { if(input.type === 'checkbox') input.checked = false; if(input.type === 'radio' && input.value === 'all') input.checked = true; });">
                    Clear Filters
                </button>
            </aside>
            <div class="products-container">
                <div class="products-toolbar">
                    <button class="filter-toggle">
                        <span>
                            <i class="bi bi-sliders"></i>
                            Filter
                        </span>
                        <i class="bi bi-chevron-down filter-arrow"></i>
                    </button>
                    <p class="">Showing <strong>1-12</strong> of <strong>48</strong> products</p>
                    <div class="toolbar-actions">
                        <label for="sort-products">Sort by:</label>
                        <select id="sort-products">
                            <option value="featured">Featured</option>
                            <option value="newest">Newest</option>
                            <option value="low">Price: Low to High</option>
                            <option value="high">Price: High to Low</option>
                        </select>
                    </div>
                </div>
                <div class="products-grid"></div>
                <div class="pagination">
                    <button disabled aria-label="Previous page">←</button>
                    <button class="current-page">1</button>
                    <button>2</button>
                    <button>3</button>
                    <span>...</span>
                    <button>4</button>
                    <button aria-label="Next page">→</button>
                </div>
            </div>
        </section>
        <section class="empty-space"></section>
    </main>

    <footer id="footer"></footer>

    <!-- mobile bottom navgation menu  -->
    <nav id="bottom-navigation-bar"></nav>

    <script src="./js/main.js" type="module"></script>
    <script src="./js/shop.js" type="module"></script>
</body>

</html>
