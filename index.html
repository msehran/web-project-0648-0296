<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VÉLORA — Unisex Fashion Store</title>
  <link rel="stylesheet" href="./css/globals.css">
  <link rel="stylesheet" href="./css/layout/header.css">
  <link rel="stylesheet" href="./css/layout/hero-section.css">
  <link rel="stylesheet" href="./css/home.css">
  <link rel="stylesheet" href="./css/layout/footer.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <main class="main">

      <div class="philosophy-image">
        <img src="./assets/images/VÉLORA Label Among Lush Leaves.png" alt="VÉLORA Label Among Lush Leaves">
      </div>
      <div class="philosophy-copy">
        <div>

          <h2 class="philosophy-title">Better Clothes.<br>A Brighter Future.</h2>

            We create timeless, versatile pieces designed for the way you live — and a more sustainable tomorrow.
          </p>
          <a href="#" class="learn-more-link">LEARN MORE <i class="bi bi-arrow-right"></i></a>
        </div>
      </div>
    </section>
    <section class="empty-space"></section>

  <footer id="footer"></footer>
  <!-- mobile bottom navgation menu  -->
  <nav id="bottom-navigation-bar"></nav>

  <script src="./js/main.js" type="module"></script>
